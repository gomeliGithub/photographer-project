# зона ограничения запросов - один запрос в секунду для каждого клиента (1МБ хватит чтобы помнить ~16000 клиентов)
# $binary_remote_addr - это ключ зоны, т.е. подсчёт ведётся для каждого ip-адреса клиента
# limit_req_zone $binary_remote_addr zone=Zone_1rsClient:1m rate=1r/s;
# зона ограничения запросов - один запрос в секунду вообще
# aaa - это ключ зоны, он получается постоянным для всех клиентов, т.е. подсчёт ведётся для всех в одном счётчике
# limit_req_zone "aaa" zone=Zone_1rs:1m rate=1r/s;
# зоны ограничений объявляем до директивы server, т.к. limit_req_zone можно объявлять только на уровне директивы http

upstream websocket {
    server 127.0.0.1:82;
}

upstream backend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    
    server_name 127.0.0.1;
    # server_name localhost;

    root I:/Nodejs/photographer-project/frontend-angular/dist/frontend-angular/browser;

    access_log I:/Nodejs/photographer-project/nginx/nginx_logs/serverAccess.log main; # в какой файл и в каком формате (main) логгируются успешные обращения
    error_log  I:/Nodejs/photographer-project/nginx/nginx_logs/serverError.log error; # в какой файл и в каком формате (error, встроенный) логгируются ошибки
    access_log I:/Nodejs/photographer-project/nginx/nginx_logs/serverProxy.log proxy;

    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|ttf|otf|svg|woff2|eot)$ {
        expires    24h;
        add_header Pragma public;
        add_header Cache-Control 'public';
        # add_header Cache-Control 'public, max-age=86400';
    }

    # Serve static files for CSR
    # location / {
    #    root I:/Nodejs/photographer-project/frontend-angular/dist/frontend-angular/browser;

    #    index index.csr.html;  # Set index.csr.html as the default index file
    #    try_files $uri $uri/ /index.csr.html;  # Fallback to index.csr.html for CSR
    # }

    # Serve dynamic SSR content for specific routes
    location / {
        # try_files $uri $uri/ /index.html?$args;

        # try_files $uri $uri @proxy;

        proxy_pass http://127.0.0.1:4000;  # Forward requests to your Node.js SSR server
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;

        proxy_cache_bypass $http_upgrade;
    }

    location @backend {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Powered-By;

        # proxy_cache_bypass $http_upgrade;
        # proxy_redirect off;

        # proxy_cache PROXYCACHE;
        # proxy_cache_valid 200 24h;
        ## proxy_cache_valid 30m;
        # proxy_cache_lock on;
        # proxy_cache_lock_timeout 60s;
        # proxy_cache_lock_age 15s;
        # proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        # proxy_cache_background_update on;
        # proxy_cache_methods GET HEAD;

        gzip_proxied any;
    }

    location ~* /api/client/downloadOriginalImage\.* {
        proxy_pass http://backend;

        proxy_hide_header X-Powered-By;

	    proxy_cache off;
    }

    location /api/sign/getActiveClient {
	    proxy_pass http://backend;

        proxy_hide_header X-Powered-By;

        proxy_cache off;
    }

    location /api/sign/up {
	    proxy_pass http://backend;

        proxy_hide_header X-Powered-By;
    
        proxy_cache off;
    }

    location /api/sign/in {
	    proxy_pass http://backend;

        proxy_hide_header X-Powered-By;
    
        proxy_cache off;
    }

    location /api/admin-panel {
        proxy_pass http://backend;

        proxy_hide_header X-Powered-By;
    
        proxy_cache off;
    }

    location /websocket {
        proxy_pass http://websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;

        proxy_hide_header X-Powered-By;
    }
}